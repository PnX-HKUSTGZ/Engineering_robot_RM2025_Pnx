arrow:
  # 箭头的8个角点，单位是m，坐标是以侧面箭头顶点位原点，z轴指向内侧的右手系
  # 顺序是：
  # 1. 外侧顶点
  # 2. 内侧顶点
  # 3. x轴外侧
  # 4. x轴内侧
  # 5. y轴外侧
  # 6. y轴内侧
  # 7. 内侧y轴与外侧y轴的交点
  # 8. 内侧x轴与外侧x轴的交点
  arrowPoints:
    - [0,0,0]
    - [10,10,0]
    - [141.42135623730950488016887242097,0,0]
    - [131.42135623730950488016887242097,10,0]
    - [0,141.42135623730950488016887242097,0]
    - [10,131.42135623730950488016887242097,0]
    - [10,0,0]
    - [0,10,0]

